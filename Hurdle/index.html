<script>
const WORD_SET = new Set([...ANSWER_WORDS, ...EXTRA_GUESSES]);
const WORD_SET_6 = new Set([...ANSWER_WORDS_6, ...EXTRA_GUESSES_6]);

const ROWS = 6;
let COLS = 5;
let sixLetterMode = false;
let level = 1;
function pickRandomFrom(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function buildLevelWords(){
  const words = {
    1: "START",
    10: "CHECK", 11: "POINT",
    20: "MATCH", 21: "THEME", 22: "WORDS", 23: "GREEN", 24: "SHORT", 25: "RESET"
  };
  const sounds = {};

  const specialLevels = [3, 6, 9, 12, 15, 18];
  const reservedLevels = [10, 11, ...specialLevels];

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  words[specialLevels[0]] = pickRandomFrom(findPatternMatches("QUACK", "G", ANSWER_WORDS));
  sounds[specialLevels[0]] = 'QUACK';

  words[specialLevels[1]] = pickRandomFrom(findPatternMatches("SWISH", "YGGY", ANSWER_WORDS));
  sounds[specialLevels[1]] = 'SWISH';

  words[specialLevels[2]] = pickRandomFrom(findPatternMatches("BLEEP", "GYYG", ANSWER_WORDS));
  sounds[specialLevels[2]] = 'BLEEP';

  words[specialLevels[3]] = pickRandomFrom(findPatternMatches("VROOM", "GY", ANSWER_WORDS));
  sounds[specialLevels[3]] = 'VROOM';

  words[specialLevels[4]] = pickRandomFrom(findPatternMatches("WHIZZ", "YG", ANSWER_WORDS));
  sounds[specialLevels[4]] = 'WHIZZ';

  words[specialLevels[5]] = pickRandomFrom(findPatternMatches("BOING", "YGG", ANSWER_WORDS));
  sounds[specialLevels[5]] = 'BOING';

  // QUACK/SWISH/BLEEP always land after the CHECK/POINT checkpoint (level 11);
  // VROOM/WHIZZ/BOING always land before it.
  const beforeCheckpointPool = [];
  const afterCheckpointPool = [];
  for(let lvl = 2; lvl <= 19; lvl++){
    if(reservedLevels.includes(lvl)) continue;
    if(lvl < 10) beforeCheckpointPool.push(lvl);
    else if(lvl > 11) afterCheckpointPool.push(lvl);
  }
  shuffle(beforeCheckpointPool);
  shuffle(afterCheckpointPool);

  const beforeWords = ["VROOM", "WHIZZ", "BOING"];
  beforeWords.forEach((word, idx) => {
    words[beforeCheckpointPool[idx]] = word;
  });

  const afterWords = ["QUACK", "SWISH", "BLEEP"];
  afterWords.forEach((word, idx) => {
    words[afterCheckpointPool[idx]] = word;
  });

  for(let lvl = 2; lvl <= 19; lvl++){
    if(!words[lvl]) words[lvl] = ANSWER_WORDS[Math.floor(Math.random() * ANSWER_WORDS.length)];
  }
  return { words, sounds };
}
let FIXED_LEVEL_WORDS, LEVEL_START_SOUNDS;
function regenerateLevelWords(){
  const built = buildLevelWords();
  FIXED_LEVEL_WORDS = built.words;
  LEVEL_START_SOUNDS = built.sounds;
  window.FIXED_LEVEL_WORDS = FIXED_LEVEL_WORDS;
  window.LEVEL_START_SOUNDS = LEVEL_START_SOUNDS;
  console.log('Level word assignments for this game (levels 1-25):', FIXED_LEVEL_WORDS);
  console.log('Level start sound effects:', LEVEL_START_SOUNDS);
}
regenerateLevelWords();
function pickAnswer(){
  if(!sixLetterMode && FIXED_LEVEL_WORDS[level]) return FIXED_LEVEL_WORDS[level];
  const words = sixLetterMode ? ANSWER_WORDS_6 : ANSWER_WORDS;
  return words[Math.floor(Math.random()*words.length)];
}
function currentWordSet(){
  return sixLetterMode ? WORD_SET_6 : WORD_SET;
}
let lastPlayedSound = null; // { type: 'row', row } or { type: 'effect', key }

function playSoundByKey(key){
  if(key === 'QUACK') return playQuack(ensureAudio());
  if(key === 'SWISH') return playSwish(ensureAudio());
  if(key === 'BLEEP') return playBleep(ensureAudio());
  if(key === 'VROOM') return playVroom(ensureAudio());
  if(key === 'WHIZZ') return playWhizz(ensureAudio());
  if(key === 'BOING') return playBoing(ensureAudio());
  return null;
}

// Locks input/replay until the given audio element finishes, so overlapping
// sounds can't be triggered while one is already playing.
function lockUntilAudioEnds(audioEl){
  over = true;
  const unlock = () => { over = false; };
  audioEl.addEventListener('ended', unlock, { once: true });
  audioEl.addEventListener('error', unlock, { once: true });
  setTimeout(unlock, 5000); // safety net in case playback silently fails
}

// Same idea for the synthesized row-reveal sounds, which report their own duration.
function lockForMs(durationMs){
  over = true;
  setTimeout(()=>{ over = false; }, durationMs);
}

function startLevel(){
  answer = pickAnswer();
  board = Array.from({length:ROWS}, ()=>({guess:"", results:null}));
  curRow = 0; curCol = 0; over = false;
  lastPlayedSound = null;
  renderBoard();
  updateLevelDisplay();
  const soundKey = LEVEL_START_SOUNDS[level];
  const levelSoundEl = playSoundByKey(soundKey);
  if(levelSoundEl){
    lastPlayedSound = { type: 'effect', key: soundKey };
    lockUntilAudioEnds(levelSoundEl);
  }
}
let answer = pickAnswer();

let audioCtx = null, analyser = null;

function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.connect(audioCtx.destination);
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playLimit(){
  const ctx = ensureAudio();
  const t0 = ctx.currentTime;
  [0, 0.07].forEach(offset=>{
    const t = t0 + offset;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'triangle'; osc.frequency.value = 300;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.linearRampToValueAtTime(0.13, t+0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.06);
    osc.connect(gain).connect(analyser);
    osc.start(t); osc.stop(t+0.07);
  });
}

function playBackspace(){
  const ctx = ensureAudio();
  const t0 = ctx.currentTime;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(500, t0);
  osc.frequency.exponentialRampToValueAtTime(200, t0+0.09);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(0.14, t0+0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.1);
  osc.connect(gain).connect(analyser);
  osc.start(t0); osc.stop(t0+0.11);
}

function playTap(){
  const ctx = ensureAudio();
  const t0 = ctx.currentTime;
  const dur = 0.045;
  const size = Math.floor(ctx.sampleRate*dur);
  const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<size;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/size, 4);
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass'; filter.frequency.value = 1400; filter.Q.value = 0.9;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.12, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  noise.connect(filter).connect(gain).connect(analyser);
  noise.start(t0); noise.stop(t0+dur+0.01);
}

function playCorrect(ctx, t0){
  // Mario-coin style: two quick bright square-wave notes, B5 -> E6
  [987.77, 1318.51].forEach((freq,i)=>{
    const t = t0 + i*0.08;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'square'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.16, t+0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.22);
    osc.connect(gain).connect(analyser);
    osc.start(t); osc.stop(t+0.24);
  });
  return 0.34;
}
function playPresent(ctx, t0){
  // plain neutral single tone — flat, no rise, no repeat
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = 440;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(0.22, t0+0.015);
  gain.gain.setValueAtTime(0.22, t0+0.2);
  gain.gain.linearRampToValueAtTime(0.0001, t0+0.26);
  osc.connect(gain).connect(analyser);
  osc.start(t0); osc.stop(t0+0.28);
  return 0.38;
}
function playAbsent(ctx, t0){
  // a "dud" — dead, muted thunk with no pitch and no ring, like a firework that didn't go off
  const dur = 0.16, size = Math.floor(ctx.sampleRate*dur);
  const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<size;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/size, 3);
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 220; filter.Q.value = 0.3;
  const ngain = ctx.createGain();
  ngain.gain.setValueAtTime(0.28, t0);
  ngain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  noise.connect(filter).connect(ngain).connect(analyser);
  noise.start(t0); noise.stop(t0+dur+0.02);

  const osc = ctx.createOscillator(), ogain = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = 90;
  ogain.gain.setValueAtTime(0.14, t0);
  ogain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(ogain).connect(analyser);
  osc.start(t0); osc.stop(t0+dur+0.02);
  return 0.3;
}
function playError(ctx){
  const t0 = ctx.currentTime;
  const dur = 0.26;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(0.13, t0+0.02);
  gain.gain.setValueAtTime(0.13, t0+dur-0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  gain.connect(analyser);

  // two gently detuned triangle tones = a soft, low buzz (no harsh edges)
  [196, 200].forEach(freq=>{
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    osc.connect(gain);
    osc.start(t0); osc.stop(t0+dur);
  });

  // light tremolo gives it a soft "buzz" texture without being sharp
  const trem = ctx.createOscillator();
  trem.type = 'sine';
  trem.frequency.value = 18;
  const tremGain = ctx.createGain();
  tremGain.gain.value = 0.06;
  trem.connect(tremGain);
  tremGain.connect(gain.gain);
  trem.start(t0); trem.stop(t0+dur);
}
function playFanfare(ctx){
  const t0 = ctx.currentTime;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
    const t = t0 + i*0.1;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type='triangle'; osc.frequency.value=f;
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(0.26,t+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    osc.connect(gain).connect(analyser);
    osc.start(t); osc.stop(t+0.45);
  });
}
function playCheckpoint(ctx){
  // milestone bell — bright ascending chime with a shimmering overtone, marking CHECK+POINT reached
  const t0 = ctx.currentTime;
  [523.25, 783.99].forEach((freq, i) => {
    const t = t0 + i * 0.14;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.28, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    osc.connect(gain).connect(analyser);
    osc.start(t); osc.stop(t + 0.62);
  });
  const shimmer = ctx.createOscillator(), shimmerGain = ctx.createGain();
  shimmer.type = 'sine';
  shimmer.frequency.value = 1567.98;
  shimmerGain.gain.setValueAtTime(0, t0 + 0.14);
  shimmerGain.gain.linearRampToValueAtTime(0.12, t0 + 0.16);
  shimmerGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
  shimmer.connect(shimmerGain).connect(analyser);
  shimmer.start(t0 + 0.14); shimmer.stop(t0 + 0.72);
}
function playLose(ctx){
  const t0 = ctx.currentTime;
  [440,349.23,261.63].forEach((f,i)=>{
    const t = t0 + i*0.16;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type='sine'; osc.frequency.value=f;
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(0.22,t+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    osc.connect(gain).connect(analyser);
    osc.start(t); osc.stop(t+0.34);

}
function playUnlock(ctx){

  const t0 = ctx.currentTime;
  [880, 1108.73, 1318.51].forEach((freq,i)=>{
    const t = t0 + i*0.06;
    const osc = ctx.createOscillator(), gain = ctx.createGain();

    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.2, t+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t+0.5);
    osc.connect(gain).connect(analyser);
    osc.start(t); osc.stop(t+0.52);
  });
}

function computeResult(guess, ans){
  const res = Array(COLS).fill('absent');
  const ansArr = ans.split('');
  const used = Array(COLS).fill(false);
  for(let i=0;i<COLS;i++){
    if(guess[i] === ansArr[i]){ res[i]='correct'; used[i]=true; }
  }
  for(let i=0;i<COLS;i++){
    if(res[i]==='correct') continue;
    const idx = ansArr.findIndex((c,j)=> c===guess[i] && !used[j]);
    if(idx !== -1){ res[i]='present'; used[idx]=true; }
  }
  return res;
}

// Console utility: findPatternMatches("VROOM", "YG") uses WORD_SET/WORD_SET_6
// automatically based on word length. guessWord is the word you TYPE; the
// function returns every possible ANSWER word that would make guessWord score
// this pattern. Pattern is just the G/Y letters, kept in order and adjacent,
// but tried at every possible position in the word (everything else must be
// gray) — so "YG" matches XXXYG, XXYGX, XYGXX, or YGXXX. Pass a wordList
// explicitly to override the default word source.
function scoreWord(guess, answer){
  const len = answer.length;
  const res = Array(len).fill('X');
  const ansArr = answer.split('');
  const used = Array(len).fill(false);
  for(let i=0;i<len;i++){
    if(guess[i] === ansArr[i]){ res[i] = 'G'; used[i] = true; }
  }
  for(let i=0;i<len;i++){
    if(res[i] === 'G') continue;
    const idx = ansArr.findIndex((c,j)=> c===guess[i] && !used[j]);
    if(idx !== -1){ res[i] = 'Y'; used[idx] = true; }
  }
  return res.join('');
}
function findPatternMatches(guessWord, pattern, wordList){
  guessWord = guessWord.toUpperCase();
  const core = pattern.toUpperCase().replace(/[^GY]/g, '');
  const len = guessWord.length;
  if(core.length > len){
    throw new Error(`Pattern (${core.length} letters) can't be longer than the guess word (${len} letters).`);
  }
  if(!wordList){
    wordList = len === 6 ? [...WORD_SET_6] : [...WORD_SET];
  }
  const matches = new Set();
  for(let offset = 0; offset <= len - core.length; offset++){
    const fullPattern = 'X'.repeat(offset) + core + 'X'.repeat(len - offset - core.length);
    for(const word of wordList){
      if(word.length === len && scoreWord(guessWord, word.toUpperCase()) === fullPattern){
        matches.add(word.toUpperCase());
      }
    }
  }
  return [...matches];
}

function tileEl(r,c){ return document.querySelector(`.tile[data-r="${r}"][data-c="${c}"]`); }

function renderBoard(){
  const boardEl = document.getElementById('board');
  document.documentElement.style.setProperty('--cols', COLS);
  boardEl.innerHTML = '';
  for(let r=0;r<ROWS;r++){
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    for(let c=0;c<COLS;c++){
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.r = r; tile.dataset.c = c;
      const letter = board[r].guess[c] || '';
      tile.textContent = letter;
      if(letter) tile.classList.add('filled');
      if(board[r].results && !blackout){
        tile.classList.add('col-'+board[r].results[c]);
        tile.style.background = board[r].results[c]==='correct' ? '#1f3a1c'
          : board[r].results[c]==='present' ? '#3d3417' : '#241f33';
        tile.style.borderColor = board[r].results[c]==='correct' ? 'var(--correct)'
          : board[r].results[c]==='present' ? 'var(--present)' : 'var(--absent)';
      }
      rowEl.appendChild(tile);
    }
    boardEl.appendChild(rowEl);
    if(board[r].results){
      const replayWrap = document.createElement('div');
      replayWrap.className = 'replay-cell';
      const btn = document.createElement('button');
      btn.className = 'replay-btn';
      btn.textContent = `🔁 replay sounds (press ${r+1})`;
      btn.title = `Press ${r+1} anytime to replay this row`;
      btn.addEventListener('click', ()=> {
        if(over) return; // a sound is already playing — don't overlap it
        lastPlayedSound = { type: 'row', row: r };
        lockForMs(playRowSounds(r));
      });
      replayWrap.appendChild(btn);
      boardEl.appendChild(replayWrap);
    }
  }
}

const KB_ROWS = ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
function renderKeyboard(){
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  KB_ROWS.forEach((row,i)=>{
    const krow = document.createElement('div');
    krow.className = 'krow';
    if(i===2){
      const enter = document.createElement('button');
      enter.className = 'key wide'; enter.textContent = 'Enter';
      enter.addEventListener('click', ()=> handleKey('ENTER'));
      krow.appendChild(enter);
    }
    row.split('').forEach(ch=>{
      const key = document.createElement('button');
      key.className = 'key'; key.textContent = ch;
      key.addEventListener('click', ()=> handleKey(ch));
      krow.appendChild(key);
    });
    if(i===2){
      const back = document.createElement('button');
      back.className = 'key wide'; back.textContent = '⌫';
      back.addEventListener('click', ()=> handleKey('BACKSPACE'));
      krow.appendChild(back);
    }
    kb.appendChild(krow);
  });
}

function setStatus(msg, isError){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
}
function announce(msg){
  document.getElementById('announcer').textContent = msg;
}

let typedBuffer = '';
function handleKey(key){
  if(over) return;
  if(key === 'ENTER'){ submitGuess(); return; }
  if(key === 'BACKSPACE'){
    typedBuffer = '';
    if(curCol>0){ curCol--; board[curRow].guess = board[curRow].guess.slice(0,curCol); renderBoard(); playBackspace(); }
    return;
  }
  if(/^[A-Z]$/.test(key)){
    if(!sixLetterMode){
      typedBuffer = (typedBuffer + key).slice(-6);
      if(typedBuffer === 'EXPAND'){
        typedBuffer = '';
        expandGrid();
        return;
      }
    }
    if(curCol < COLS){
      board[curRow].guess += key;
      curCol++;
      renderBoard();
      playTap();
    } else {
      playLimit();
    }
  }
}

function expandGrid(){
  if(sixLetterMode) return;
  sixLetterMode = true;
  COLS = 6;
  level = 1;
  startLevel();
  playUnlock(ensureAudio());
  setStatus('Grid expanded to 6 letters! New word.');
  announce('Grid expanded to six letters. Level reset.');
}

function shakeRow(r){
  for(let c=0;c<COLS;c++){
    const t = tileEl(r,c);
    t.classList.add('shake');
    setTimeout(()=>t.classList.remove('shake'), 360);
  }
}

function submitGuess(){
  const guess = board[curRow].guess;
  if(guess === 'DEBUG'){
    setBlackout(!blackout);
    board[curRow].guess = '';
    curCol = 0;
    renderBoard();
    return;
  }
  if(guess === 'RESET'){
    level = 1;
    regenerateLevelWords();
    startLevel();
    playLose(ensureAudio());
    setStatus('Level reset to 1.');
    announce('Level reset to 1. New word.');
    return;
  }
  if(guess === 'SKIPS' && !blackout){
    level++;
    startLevel();
    setStatus(`Skipped to level ${level}.`);
    announce(`Skipped to level ${level}. New word.`);
    return;
  }
  if(guess.length < COLS){
    setStatus('Not enough letters.', true);
    shakeRow(curRow);
    if(audioCtx) playError(audioCtx); else playError(ensureAudio());
    return;
  }
  if(!currentWordSet().has(guess)){
    setStatus(`"${guess}" isn't in the word list.`, true);
    shakeRow(curRow);
    playError(ensureAudio());
    return;
  }
  setStatus('');
  const results = computeResult(guess, answer);
  board[curRow].results = results;
  renderBoard();
  announce(`Row ${curRow+1} submitted. Listen for the result.`);
  lastPlayedSound = { type: 'row', row: curRow };
  const revealDuration = playRowSounds(curRow);

  const won = results.every(r=>r==='correct');
  const finishedRow = curRow;
  curRow++; curCol = 0;
  over = true; // lock input until the reveal sounds finish

  setTimeout(()=>{
    if(won){
      level++;
      if(answer === 'POINT') playCheckpoint(ensureAudio());
      else playFanfare(ensureAudio());
      announce(`Solved in ${finishedRow+1} ${finishedRow===0?'try':'tries'}. Level ${level} — starting a new word.`);
      setTimeout(()=> resetGame(), 900); // resetGame -> startLevel unlocks input
    } else if(curRow >= ROWS){
      playLose(ensureAudio());
      level = (level > 11) ? 10 : 1;
      regenerateLevelWords();
      announce(`Out of guesses. The word was ${answer}. Back to level ${level}.`);
      setTimeout(()=> resetGame(), 900); // resetGame -> startLevel unlocks input
    } else {
      over = false; // round continues, unlock for the next row
    }
  }, revealDuration + 200);
}

function playRowSounds(r){
  const ctx = ensureAudio();
  const results = board[r].results;
  const GAP = 0.11; // pause between each letter's sound, so they're easier to tell apart
  const start = ctx.currentTime;
  let cursor = start + 0.05;
  for(let i=0;i<COLS;i++){
    const type = results[i];
    const t = tileEl(r,i);
    const delay = Math.max(0,(cursor-ctx.currentTime)*1000);
    setTimeout(()=>{
      const cls = !blackout ? 'pulse-'+type : 'pulse';
      t.classList.add(cls);
      setTimeout(()=>t.classList.remove(cls), 420);
    }, delay);
    let dur;
    if(type==='correct') dur = playCorrect(ctx,cursor);
    else if(type==='present') dur = playPresent(ctx,cursor);
    else dur = playAbsent(ctx,cursor);
    cursor += dur + GAP;
  }
  return (cursor - start) * 1000; // total playback duration in ms, for callers that need to wait it out
}

function updateLevelDisplay(){
  document.getElementById('level-badge').textContent = `Level ${level}`;
}

function resetGame(){
  setStatus('');
  startLevel();
}



let blackout = false;
function setBlackout(on){
  blackout = on;
  document.getElementById('blackout').classList.toggle('active', on);
  renderBoard();
  announce(on ? 'Blackout mode on. Type DEBUG and submit it to toggle.' : 'Blackout mode off.');
}

document.addEventListener('keydown', (e)=>{
  ensureAudio();
  if(e.code === 'Space'){
    e.preventDefault();
    if(over) return; // a sound is already playing — don't overlap it
    if(lastPlayedSound && lastPlayedSound.type === 'effect'){
      const el = playSoundByKey(lastPlayedSound.key);
      if(el) lockUntilAudioEnds(el);
      announce('Replaying level sound effect.');
    } else if(lastPlayedSound && lastPlayedSound.type === 'row'){
      lockForMs(playRowSounds(lastPlayedSound.row));
      announce(`Replaying row ${lastPlayedSound.row+1}.`);
    } else {
      let lastRow = -1;
      for(let i=0;i<board.length;i++){ if(board[i].results) lastRow = i; }
      if(lastRow !== -1){
        lastPlayedSound = { type: 'row', row: lastRow };
        lockForMs(playRowSounds(lastRow));
        announce(`Replaying row ${lastRow+1}.`);
      } else {
        playError(ensureAudio());
        announce('No guesses yet to replay.');
      }
    }
    return;
  }
  if(/^[1-6]$/.test(e.key)){
    if(over) return; // a sound is already playing — don't overlap it
    const idx = parseInt(e.key, 10) - 1;
    if(board[idx] && board[idx].results){
      lastPlayedSound = { type: 'row', row: idx };
      lockForMs(playRowSounds(idx));
      announce(`Replaying row ${idx+1}.`);
    } else {
      playError(ensureAudio());
      announce(`No guess yet for row ${idx+1}.`);
    }
    return;
  }
  const k = e.key.toUpperCase();
  if(k === 'ENTER') handleKey('ENTER');
  else if(k === 'BACKSPACE') handleKey('BACKSPACE');
  else if(/^[A-Z]$/.test(k)) handleKey(k);
});

renderBoard();
renderKeyboard();
updateLevelDisplay();
setBlackout(true);
</script>
